<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doxograph</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1>Doxograph</h1>
  <span class="stats" id="stats"></span>
  <div class="actions">
    <button type="button" id="btn-retag" title="Reassign tags on every paper against the current vocabulary">Retag all</button>
    <button type="button" id="btn-bib">BibTeX</button>
    <button type="button" id="btn-export" class="primary">Export HTML</button>
    <div class="settings-wrap">
      <button type="button" id="btn-settings" aria-haspopup="dialog" aria-expanded="false"
        aria-controls="settings-menu">Settings</button>
      <div class="settings-menu" id="settings-menu" role="dialog" aria-labelledby="settings-title" hidden>
        <div class="settings-head">
          <h2 id="settings-title">Appearance</h2>
          <button type="button" class="icon-button" id="btn-close-settings" aria-label="Close settings">×</button>
        </div>
        <fieldset>
          <legend>Mode</legend>
          <div class="choice-row">
            <label><input type="radio" name="appearance" value="system"> System</label>
            <label><input type="radio" name="appearance" value="light"> Light</label>
            <label><input type="radio" name="appearance" value="dark"> Dark</label>
          </div>
        </fieldset>
        <fieldset>
          <legend>Color theme</legend>
          <div class="theme-grid">
            <label class="theme-choice">
              <input type="radio" name="color-theme" value="slate">
              <span class="theme-preview slate" aria-hidden="true"><i></i><i></i><i></i></span>
              <span>Slate</span>
            </label>
            <label class="theme-choice">
              <input type="radio" name="color-theme" value="forest">
              <span class="theme-preview forest" aria-hidden="true"><i></i><i></i><i></i></span>
              <span>Forest</span>
            </label>
            <label class="theme-choice">
              <input type="radio" name="color-theme" value="plum">
              <span class="theme-preview plum" aria-hidden="true"><i></i><i></i><i></i></span>
              <span>Plum</span>
            </label>
            <label class="theme-choice">
              <input type="radio" name="color-theme" value="sepia">
              <span class="theme-preview sepia" aria-hidden="true"><i></i><i></i><i></i></span>
              <span>Sepia</span>
            </label>
          </div>
        </fieldset>
        <div class="settings-foot">
          <span class="hint">Saved in this browser</span>
          <button type="button" id="btn-reset-theme">Reset</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div id="layout">
  <aside id="side">
    <div class="drop" id="drop">Drop PDFs anywhere on this page</div>
    <textarea id="refs" placeholder="Paste arXiv IDs, arXiv or DOI links, or PDF URLs — one per line"></textarea>
    <div class="row">
      <label class="hint"><input type="checkbox" id="auto-extract" checked> read on arrival</label>
      <button type="button" id="btn-add" class="primary" style="margin-left:auto">Add</button>
    </div>

    <div class="sec">
      <h2>Papers</h2>
      <ul class="plist" id="papers"></ul>
    </div>

    <div class="sec">
      <h2>Tensions</h2>
      <ul class="plist" id="tensions-nav"></ul>
      <div class="row right">
        <button type="button" id="btn-tensions" title="Ask the model which claims in each topic pull against each other">Find tensions</button>
      </div>
    </div>

    <div class="sec">
      <h2>Topics</h2>
      <ul class="taglist" id="tags"></ul>
      <div class="row">
        <input id="new-tag" placeholder="new topic" style="flex:1">
        <button type="button" id="btn-tag">Add</button>
      </div>
      <div class="row right">
        <button type="button" id="btn-synth" title="Ask the model what the papers, taken together, hold on each topic with two or more papers">Synthesize topics</button>
      </div>
    </div>
  </aside>

  <section id="main">
    <div class="filters">
      <input type="search" id="q" placeholder="Filter claims, quotes, papers">
      <select id="kind"><option value="">every kind</option></select>
      <label><input type="checkbox" id="only-unreviewed"> unreviewed only</label>
      <label><input type="checkbox" id="group-by-tag" checked> group by topic</label>
    </div>
    <div id="content"></div>
  </section>
</div>

<div class="jobs" id="jobs"></div>
<ul class="ctxmenu" id="ctxmenu" hidden></ul>
<script src="/app.js"></script>
</body>
</html>
