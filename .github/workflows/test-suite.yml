name: Test suite
# auto-merge.yml finds the run for a PR by this title, which records the base
# branch the run tested.
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      format('Tests for pull request #{0} against {1}', github.event.pull_request.number, github.event.pull_request.base.ref) ||
      format('Tests for {0}', github.ref_name) }}

on:
  pull_request:
    # Base-branch changes arrive as edited events. Auto-merge requires a new run
    # after retargeting because the PR's tested merge ref has changed.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Python tests
        run: python -m pytest -m "not browser" -v --tb=short --durations=20

  browser:
    name: Browser tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the project and test dependencies
        run: python -m pip install -e ".[dev]"
      # The install has hung on some runners for the whole job: `--with-deps`
      # runs apt-get, which waits in silence for a lock another process holds
      # at boot. A hung attempt is killed and tried again instead.
      - name: Install Chromium and WebKit
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if timeout 150 python -m playwright install --with-deps chromium webkit; then
              exit 0
            fi
            echo "Browser install attempt $attempt did not finish; trying again" >&2
            sleep 10
          done
          echo "Browser install failed three times" >&2
          exit 1
      - name: Run browser tests
        run: python -m pytest -m browser --browser-shard=${{ matrix.shard }}/4 -v --tb=short --durations=20

  # Preserve the check name required by branch protection and auto-merge.
  # Always run so a failed or skipped dependency cannot leave a green gate.
  tests:
    name: Python and browser tests
    needs: [python, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every test job to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$PYTHON_RESULT" = success && test "$BROWSER_RESULT" = success
