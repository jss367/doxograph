name: Test suite
# auto-merge.yml finds the run for a PR by this title, which records the base
# branch the run tested.
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      format('Tests for pull request #{0} against {1}', github.event.pull_request.number, github.event.pull_request.base.ref) ||
      format('Tests for {0}', github.ref_name) }}

on:
  pull_request:
    # Base-branch changes arrive as edited events. Auto-merge requires a new run
    # after retargeting because the PR's tested merge ref has changed.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read

# A new commit or retarget supersedes a PR's earlier runs, and auto-merge only
# reads the newest one, so cancel them. On main, let the running push finish;
# GitHub still drops a waiting push run when a newer one arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # 5m setup + 220s test process + 2m artifact upload + 80s cleanup.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out the repository
        timeout-minutes: 1
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        timeout-minutes: 1
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install the project and test dependencies
        timeout-minutes: 3
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Run Python tests
        shell: bash
        env:
          PYTHON_SHARD: ${{ matrix.shard }}/4
        # The process deadline also covers collection and session teardown.
        # Output goes to a file, not a pipe: a process that outlives pytest
        # would hold a pipe open and keep the step running to the job timeout.
        run: |
          mkdir -p test-results
          status=0
          timeout --signal=ABRT --kill-after=10s 210s \
            python -u -X faulthandler -m pytest -p no_live_providers \
            -m "not browser" --python-shard="$PYTHON_SHARD" \
            -v --tb=short --durations=0 --durations-min=0 \
            --timeout=60 --timeout-method=thread -o faulthandler_timeout=30 \
            --report-log=test-results/events.jsonl --junitxml=test-results/junit.xml \
            > test-results/console.log 2>&1 || status=$?
          cat test-results/console.log
          echo "pytest exited with $status; processes still running:"
          ps -eo pid,ppid,pgid,etimes,args --forest | tee test-results/processes.txt
          exit "$status"
      - name: Retain Python test diagnostics
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: python-tests-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Browser tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install the project and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
      # Browser downloads are cached by Playwright version; the system packages
      # still come from apt, which on some runners is slow enough to take the
      # whole job. The step is given the time rather than cut short: killing
      # it leaves apt-get holding the dpkg lock and every retry failing on it.
      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Cache the browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and WebKit
        timeout-minutes: 30
        run: python -m playwright install --with-deps chromium webkit
      - name: Run browser tests
        run: python -m pytest -m browser --browser-shard=${{ matrix.shard }}/4 -v --tb=short --durations=20

  # Preserve the check name required by branch protection and auto-merge.
  # Always run so a failed or skipped dependency cannot leave a green gate.
  tests:
    name: Python and browser tests
    needs: [python, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every test job to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$PYTHON_RESULT" = success && test "$BROWSER_RESULT" = success

  quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check Python correctness
        run: python -m ruff check doxograph tests
      - name: Check storage and provider contracts
        run: python -m mypy
      - name: Check JavaScript syntax
        run: |
          for asset in doxograph/static/*.js; do
            node --check "$asset"
          done
      - name: Test frontend request and workspace behavior
        run: node --test tests/frontend/*.test.cjs

  native:
    name: Native macOS checks
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Type-check the app
        run: |
          swiftc -typecheck -swift-version 5 \
            -target "$(uname -m)-apple-macosx13.0" \
            -framework AppKit -framework WebKit native/Sources/*.swift
      - name: Test the update summary
        run: bash native/test-updater.sh
      - name: Test quitting and relaunching
        run: bash native/test-quit.sh
