name: Test suite
# auto-merge.yml finds the run for a PR by this title, which records the base
# branch the run tested.
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      format('Tests for pull request #{0} against {1}', github.event.pull_request.number, github.event.pull_request.base.ref) ||
      format('Tests for {0}', github.ref_name) }}

on:
  pull_request:
    # Base-branch changes arrive as edited events. Auto-merge requires a new run
    # after retargeting because the PR's tested merge ref has changed.
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install the project and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Install Chromium and WebKit
        run: python -m playwright install --with-deps chromium webkit
      - name: Run the test suite
        run: python -m pytest -v --tb=short

  quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Check Python correctness
        run: python -m ruff check doxograph tests
      - name: Check storage contracts
        run: python -m mypy
      - name: Check JavaScript syntax
        run: |
          for asset in doxograph/static/*.js; do
            node --check "$asset"
          done

  native:
    name: Native macOS checks
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Type-check the app
        run: |
          swiftc -typecheck -swift-version 5 \
            -target "$(uname -m)-apple-macosx13.0" \
            -framework AppKit -framework WebKit native/Sources/*.swift
      - name: Test quitting and relaunching
        run: bash native/test-quit.sh
