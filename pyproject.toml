[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doxograph"
version = "0.2.0"
description = "Extract claims from papers and browse them by topic."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.110",
    "pydantic>=2",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "playwright>=1.55",
]

[project.scripts]
doxograph = "doxograph.__main__:main"

[tool.setuptools]
packages = ["doxograph"]

[tool.setuptools.package-data]
doxograph = ["static/*"]

[tool.pytest.ini_options]
markers = [
    "browser: localhost browser smoke tests",
]
