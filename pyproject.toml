[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doxograph"
version = "0.12.0"
description = "Extract claims from papers and browse them by topic."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.110",
    "pydantic>=2",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "jsonschema>=4.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "fpdf2>=2.8.8",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "playwright>=1.55",
    "ruff>=0.17",
    "mypy>=2.4",
]

[project.scripts]
doxograph = "doxograph.__main__:main"

[tool.setuptools]
packages = ["doxograph"]

[tool.setuptools.package-data]
doxograph = ["static/*", "static/vendor/*", "static/vendor/fonts/*", "static/vendor/cmaps/*", "static/vendor/standard_fonts/*", "static/vendor/wasm/*"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = [
    "browser: localhost browser smoke tests",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Start with syntax and correctness checks, without restyling the repository.
select = ["E9", "F"]

[tool.mypy]
python_version = "3.13"
# Enforce strict contracts at the shared storage boundary first. Expand this
# list as the older dictionary-based modules acquire narrower annotations.
files = ["doxograph/storage.py", "doxograph/records.py"]
strict = true
follow_imports = "silent"
