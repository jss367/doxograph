[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doxograph"
version = "0.20.0"
description = "Extract claims from papers and browse them by topic."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.110",
    "pydantic>=2",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "jsonschema>=4.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "fpdf2>=2.8.8",
    "Pillow>=10",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.4",
    "pytest-reportlog>=0.4",
    "playwright>=1.55",
    "ruff>=0.17",
    "mypy>=2.4",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.0",
]

[project.scripts]
doxograph = "doxograph.__main__:main"

[tool.setuptools]
packages = ["doxograph"]

[tool.setuptools.package-data]
doxograph = ["static/*", "static/vendor/*", "static/vendor/fonts/*", "static/vendor/cmaps/*", "static/vendor/standard_fonts/*", "static/vendor/wasm/*"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = [
    "browser: localhost browser integration tests",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Syntax, correctness, and bug-prone patterns, without restyling the repository.
select = ["E9", "F", "B"]

[tool.mypy]
python_version = "3.13"
# Every module in the package is checked strictly except mcp_server.py and
# workspace_archive.py, which are still being annotated. Add them here once
# they pass, then this list can become the whole package.
files = [
    "doxograph/__init__.py", "doxograph/__main__.py",
    "doxograph/storage.py", "doxograph/records.py", "doxograph/publication_dates.py", "doxograph/workspace_metadata.py",
    "doxograph/store.py",
    "doxograph/analysis_types.py", "doxograph/ask_context.py",
    "doxograph/model_errors.py", "doxograph/providers.py",
    "doxograph/claude_code.py", "doxograph/codex_cli.py",
    "doxograph/server.py", "doxograph/origins.py", "doxograph/activity.py",
    "doxograph/job_queue.py", "doxograph/papers_api.py", "doxograph/chat_api.py",
    "doxograph/chat_attachments.py",
    "doxograph/datasets.py",
    "doxograph/loupe.py",
    "doxograph/analysis_api.py",
    "doxograph/agent.py", "doxograph/backups.py", "doxograph/bib.py",
    "doxograph/chat.py", "doxograph/chats.py", "doxograph/cites.py",
    "doxograph/config.py", "doxograph/export.py", "doxograph/extract.py",
    "doxograph/fingerprint.py", "doxograph/ingest.py", "doxograph/job_journal.py",
    "doxograph/loupe_runner.py", "doxograph/notebook.py", "doxograph/pairs.py",
    "doxograph/posts.py", "doxograph/query.py", "doxograph/quotes.py",
    "doxograph/research_notes.py", "doxograph/search.py",
]
strict = true
follow_imports = "silent"
