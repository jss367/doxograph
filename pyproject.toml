[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doxograph"
version = "0.1.0"
description = "Extract claims from papers and browse them by topic."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
doxograph = "doxograph.__main__:main"

[tool.setuptools]
packages = ["doxograph"]

[tool.setuptools.package-data]
doxograph = ["static/*"]
